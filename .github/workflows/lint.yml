name: lint

on:
  push:
    branches: ["stable"]
    paths:
      - 'src/SysAdminToolbox/SysAdminToolbox.py'
      - 'tests/**'
  pull_request:
    branches: ["stable"]
    paths:
      - 'src/SysAdminToolbox/SysAdminToolbox.py'
      - 'tests/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Lint for correctness (pyflakes + syntax errors)
        run: flake8 src/ tests/ --count --select=F,E9 --show-source --statistics
